<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>うたがな</title>
<link rel="icon" type="image/png" href="uta.PNG">
<link rel="apple-touch-icon" href="uta.PNG">
<meta name="theme-color" content="#ec6f91">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#fff8fa;
    --bg-panel:#ffedf2;
    --bg-panel-hi:#ffdce6;
    --ink:#3a2e33;
    --ink-dim:#9c7c86;
    --ink-faint:#c9a8b2;
    --gold:#ec6f91;
    --gold-dim:#ec6f9126;
    --plum:#c4485c;
    --on-accent:#ffffff;
    --line:rgba(58,46,51,0.10);
    --line-hi:rgba(58,46,51,0.20);
    --shadow-accent:#c24e70;
    --shadow-panel:#e3b9c5;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at 20% -10%, #ffffff 0%, var(--bg-deep) 60%);
    color:var(--ink);
    font-family:'Zen Maru Gothic','Noto Sans SC',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Space Mono',monospace;}
  .mincho{font-family:'Shippori Mincho',serif;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--gold);outline-offset:2px;
  }

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);
    flex-wrap:wrap;gap:12px;
    position:sticky;top:0;z-index:50;
    background:rgba(255,248,250,0.92);backdrop-filter:blur(8px);
    box-shadow:0 2px 10px rgba(58,46,51,.05);
  }
  .brand{display:flex;align-items:baseline;gap:14px;cursor:pointer;border-radius:10px;padding:2px 4px;margin:-2px -4px;transition:transform .08s ease;}
  .brand:active{transform:translateY(1px);}
  .brand h1{font-family:'Shippori Mincho',serif;font-weight:700;font-size:clamp(20px,3.2vw,26px);letter-spacing:.08em;margin:0;}
  .brand span.sub{color:var(--ink-dim);font-size:11.5px;letter-spacing:.1em;}
  .header-right{display:flex;align-items:center;gap:14px;}

  /* ---- cover / home page ---- */
  .cover-page{
    min-height:calc(100vh - 76px);display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 20px;gap:26px;
  }
  .cover-title{font-family:'Shippori Mincho',serif;font-weight:700;font-size:clamp(38px,8vw,64px);letter-spacing:.1em;}
  .cover-sub{color:var(--ink-dim);font-size:14px;letter-spacing:.1em;margin-top:-14px;}
  .cover-stats{display:flex;gap:28px;color:var(--ink-faint);font-size:12px;font-family:'Space Mono',monospace;}
  .cover-stats b{color:var(--gold);font-size:16px;display:block;font-family:'Zen Maru Gothic',sans-serif;}
  .cover-cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
  .cover-card{
    width:200px;background:var(--bg-panel);border:1px solid var(--line);border-radius:20px;padding:26px 20px;
    box-shadow:0 4px 0 var(--shadow-panel), 0 6px 14px rgba(58,46,51,.06);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .cover-card:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow-panel);}
  .cover-card .cc-icon{font-size:30px;margin-bottom:10px;}
  .cover-card .cc-title{font-family:'Shippori Mincho',serif;font-size:18px;margin-bottom:4px;}
  .cover-card .cc-desc{font-size:12px;color:var(--ink-dim);}

  .page-tabs{display:flex;gap:6px;background:var(--bg-panel);border:1px solid var(--line);border-radius:999px;padding:4px;}
  .page-tab{background:transparent;border:none;color:var(--ink-dim);padding:7px 18px;border-radius:999px;font-size:13px;letter-spacing:.04em;transition:transform .08s ease, background .15s;}
  .page-tab.active{background:var(--gold);color:var(--on-accent);font-weight:700;box-shadow:0 2px 0 var(--shadow-accent);}
  .page-tab:active{transform:translateY(2px);}

  .icon-btn{
    background:var(--bg-panel);border:1px solid var(--line);color:var(--ink-dim);
    width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    transition:border-color .2s, color .2s, transform .08s ease, box-shadow .08s ease;flex:0 0 auto;
    box-shadow:0 2px 0 var(--shadow-panel);
  }
  .icon-btn:hover{border-color:var(--gold);color:var(--gold);}
  .icon-btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--shadow-panel);}

  main{display:block;min-height:calc(100vh - 76px);}

  /* ---- kana page ---- */
  .kana-page{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:1px;background:var(--line);}
  @media (max-width:860px){ .kana-page{grid-template-columns:1fr;} }
  .pane{background:var(--bg-deep);padding:clamp(14px,2.4vw,26px);}

  .progress-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:12px;color:var(--ink-dim);}
  .progress-bar{flex:1;height:5px;border-radius:999px;background:var(--bg-panel);overflow:hidden;}
  .progress-fill{height:100%;background:var(--gold);border-radius:999px;transition:width .4s ease;}

  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tab-btn{background:var(--bg-panel);border:1px solid var(--line);color:var(--ink-dim);padding:7px 14px;border-radius:999px;font-size:12.5px;letter-spacing:.04em;transition:transform .08s ease, box-shadow .08s ease, border-color .15s, color .15s;box-shadow:0 2px 0 var(--shadow-panel);}
  .tab-btn.active{background:var(--gold);color:var(--on-accent);border-color:var(--gold);font-weight:700;box-shadow:0 2px 0 var(--shadow-accent);}
  .tab-btn:not(.active):hover{border-color:var(--line-hi);color:var(--ink);}
  .tab-btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--shadow-panel);}
  .tab-btn.active:active{box-shadow:0 0 0 var(--shadow-accent);}

  .kgrid{display:grid;gap:7px;}
  .klabel{display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-faint);}
  .klabel.row{justify-content:flex-end;padding-right:4px;}
  .kbtn{
    position:relative;background:var(--bg-panel);border:1px solid var(--line);color:var(--ink);border-radius:16px;
    aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:clamp(15px,2vw,19px);
    transition:transform .08s ease, border-color .15s, background .15s, box-shadow .08s ease;
    box-shadow:0 3px 0 var(--shadow-panel), 0 4px 8px rgba(58,46,51,.06);
  }
  .kbtn.empty{visibility:hidden;pointer-events:none;box-shadow:none;}
  .kbtn:hover{border-color:var(--line-hi);}
  .kbtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--shadow-panel);}
  .kbtn.has-hits{box-shadow:inset 0 0 0 1px var(--gold-dim), 0 3px 0 var(--shadow-panel), 0 4px 8px rgba(58,46,51,.06);}
  .kbtn.has-hits::after{content:'';position:absolute;bottom:6px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--gold);}
  .kbtn.selected{background:var(--gold);color:var(--on-accent);border-color:var(--gold);box-shadow:0 3px 0 var(--shadow-accent);}
  .kbtn.selected:active{box-shadow:0 0 0 var(--shadow-accent);}
  .kbtn.selected::after{background:var(--on-accent);}
  .kbtn.pulse{box-shadow:0 0 0 6px var(--gold-dim);}

  .detail-empty{color:var(--ink-dim);border:1px dashed var(--line);border-radius:var(--radius);padding:40px 20px;text-align:center;}
  .detail-head{display:flex;align-items:baseline;gap:16px;margin-bottom:22px;}
  .detail-kana{font-size:56px;font-family:'Shippori Mincho',serif;line-height:1;}
  .detail-romaji{font-family:'Space Mono',monospace;color:var(--gold);font-size:16px;}
  .detail-sec-title{font-size:12px;letter-spacing:.1em;color:var(--ink-faint);margin:22px 0 10px;text-transform:uppercase;}
  .word-chip{display:inline-flex;align-items:baseline;gap:8px;background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:0 8px 8px 0;}
  .word-chip .w-text{font-size:16px;}
  .word-chip .w-reading{font-size:11px;color:var(--ink-dim);}
  .word-chip .w-gloss{font-size:12.5px;color:var(--ink-dim);border-left:1px solid var(--line-hi);padding-left:8px;margin-left:2px;}
  .line-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
  .line-card .lc-jp{font-size:15px;margin-bottom:4px;}
  .line-card .lc-zh{font-size:12.5px;color:var(--ink-dim);margin-bottom:8px;}
  .line-card .lc-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-faint);}
  .lc-jump{background:var(--bg-deep);border:1px solid var(--line);color:var(--ink-dim);border-radius:999px;padding:4px 12px;font-size:11px;box-shadow:0 2px 0 var(--shadow-panel);transition:transform .08s ease, box-shadow .08s ease, border-color .15s, color .15s;}
  .lc-jump:hover{border-color:var(--gold);color:var(--gold);}
  .lc-jump:active{transform:translateY(2px);box-shadow:0 0 0 var(--shadow-panel);}

  /* ---- lyrics page ---- */
  .lyrics-page{padding:clamp(14px,2.4vw,26px) clamp(16px,4vw,48px);}
  .toggle-line{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-dim);margin-bottom:14px;}
  .toggle-line input{accent-color:var(--gold);}
  .songlist{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;}
  .song-chip{flex:0 0 auto;background:var(--bg-panel);border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:13px;color:var(--ink-dim);white-space:nowrap;box-shadow:0 2px 0 var(--shadow-panel);transition:transform .08s ease, box-shadow .08s ease, border-color .15s, color .15s;}
  .song-chip.active{border-color:var(--gold);color:var(--gold);background:var(--bg-panel-hi);}
  .song-chip:hover{color:var(--ink);}
  .song-chip:active{transform:translateY(2px);box-shadow:0 0 0 var(--shadow-panel);}
  .add-song-chip{flex:0 0 auto;background:transparent;border:1px dashed var(--line-hi);color:var(--ink-dim);padding:9px 16px;border-radius:999px;font-size:13px;transition:transform .08s ease;}
  .add-song-chip:hover{color:var(--gold);border-color:var(--gold);}
  .add-song-chip:active{transform:translateY(2px);}

  .empty-state{border:1px dashed var(--line);border-radius:var(--radius);padding:40px 20px;text-align:center;color:var(--ink-dim);}
  .empty-state button{margin-top:14px;background:var(--gold);color:var(--on-accent);border:none;padding:10px 22px;border-radius:999px;font-weight:700;font-size:13.5px;box-shadow:0 3px 0 var(--shadow-accent);transition:transform .08s ease, box-shadow .08s ease;}
  .empty-state button:active{transform:translateY(3px);box-shadow:0 0 0 var(--shadow-accent);}

  .lyrics{max-width:680px;}
  .lyrics .song-meta{margin-bottom:20px;}
  .lyrics .song-meta h2{font-family:'Shippori Mincho',serif;font-size:22px;margin:0 0 2px;}
  .lyrics .song-meta .artist{color:var(--ink-dim);font-size:13px;}
  .lyrics-line{margin-bottom:6px;padding:10px 12px;border-radius:10px;transition:background .3s;}
  .lyrics-line.pulse-line{background:var(--gold-dim);}
  .lyrics-line .jp-row{line-height:2.5;font-size:19px;}
  ruby{position:relative;cursor:pointer;border-radius:4px;padding:0 1px;}
  ruby:hover{background:var(--bg-panel-hi);}
  ruby rt{font-family:'Zen Maru Gothic',sans-serif;font-size:10px;color:var(--ink-dim);letter-spacing:0;user-select:none;}
  .tok-plain{cursor:pointer;border-radius:4px;padding:0 1px;}
  .tok-plain:hover{background:var(--bg-panel-hi);}
  .tok-glow{background:var(--gold-dim);box-shadow:inset 0 0 0 1px var(--gold);}
  .romaji-row{display:none;color:var(--ink-faint);font-size:12px;margin-top:-4px;}
  .zh-row{color:var(--ink-dim);font-size:13.5px;margin-top:2px;margin-bottom:16px;}
  .show-romaji .romaji-row{display:block;}

  /* ---- token popover ---- */
  .popover{position:fixed;z-index:60;background:var(--bg-panel-hi);border:1px solid var(--line-hi);border-radius:10px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.45);min-width:180px;font-size:13px;}
  .popover .pv-reading{font-size:17px;margin-bottom:2px;}
  .popover .pv-gloss{color:var(--ink);font-size:12.5px;margin-bottom:6px;}
  .popover .pv-romaji{color:var(--ink-dim);font-family:'Space Mono',monospace;font-size:12px;margin-bottom:10px;}
  .popover .pv-kanas{display:flex;gap:6px;flex-wrap:wrap;}
  .pv-kana-btn{background:var(--bg-panel);border:1px solid var(--line);color:var(--ink);padding:5px 10px;border-radius:10px;font-size:13px;box-shadow:0 2px 0 var(--shadow-panel);transition:transform .08s ease, box-shadow .08s ease, border-color .15s, color .15s;}
  .pv-kana-btn:hover{border-color:var(--gold);color:var(--gold);}
  .pv-kana-btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--shadow-panel);}

  /* ---- modals ---- */
  .overlay{position:fixed;inset:0;background:rgba(8,9,13,.68);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;}
  .modal{background:var(--bg-panel);border:1px solid var(--line-hi);border-radius:14px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:26px;}
  .modal h3{font-family:'Shippori Mincho',serif;margin:0 0 18px;font-size:19px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-dim);margin-bottom:6px;}
  .field input[type=text],.field input[type=password],.field textarea{width:100%;background:var(--bg-deep);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px;resize:vertical;}
  .field textarea{min-height:140px;line-height:1.7;}
  .field input:focus,.field textarea:focus{border-color:var(--gold);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}
  .btn{border:1px solid var(--line);background:var(--bg-deep);color:var(--ink-dim);padding:9px 18px;border-radius:999px;font-size:13.5px;box-shadow:0 2px 0 var(--shadow-panel);transition:transform .08s ease, box-shadow .08s ease;}
  .btn:hover{color:var(--ink);border-color:var(--line-hi);}
  .btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--shadow-panel);}
  .btn.primary{background:var(--gold);color:var(--on-accent);border-color:var(--gold);font-weight:700;box-shadow:0 3px 0 var(--shadow-accent);}
  .btn.primary:hover{opacity:.92;}
  .btn.primary:active{transform:translateY(3px);box-shadow:0 0 0 var(--shadow-accent);}
  .btn.primary:disabled{opacity:.5;pointer-events:none;}
  .radio-row{display:flex;flex-direction:column;gap:8px;}
  .radio-opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;}
  .radio-opt.selected{border-color:var(--gold);}
  .radio-opt input{accent-color:var(--gold);}
  .radio-opt .tag{margin-left:auto;font-size:11px;color:var(--ink-faint);}
  .loading-row{display:flex;align-items:center;gap:10px;color:var(--ink-dim);font-size:13.5px;margin-top:4px;}
  .spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-hi);border-top-color:var(--gold);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{background:var(--bg-panel-hi);border:1px solid var(--line-hi);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:0 8px 22px rgba(0,0,0,.4);animation:toastIn .25s ease;}
  @keyframes toastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  ::selection{background:var(--gold-dim);}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>
<body>

<header>
  <div class="brand" id="brandHome" title="返回封面">
    <h1>うたがな</h1>
    <span class="sub">五十音 × 你的歌单</span>
  </div>
  <div class="header-right">
    <button class="icon-btn" id="homeBtn" title="封面" aria-label="返回封面">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    </button>
    <div class="page-tabs" id="pageTabs">
      <button class="page-tab" data-page="kana">假名</button>
      <button class="page-tab" data-page="lyrics">歌词</button>
    </div>
    <button class="icon-btn" id="settingsBtn" title="设置" aria-label="设置">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
    </button>
  </div>
</header>

<main id="mainArea"></main>

<div id="modalRoot"></div>
<div id="toast-wrap"></div>

<script>
(function(){
  "use strict";

  /* ===================== 假名表数据 ===================== */
  var SEION = [
    ['あ','い','う','え','お'],['か','き','く','け','こ'],['さ','し','す','せ','そ'],
    ['た','ち','つ','て','と'],['な','に','ぬ','ね','の'],['は','ひ','ふ','へ','ほ'],
    ['ま','み','む','め','も'],['や',null,'ゆ',null,'よ'],['ら','り','る','れ','ろ'],
    ['わ',null,null,null,'を'],['ん',null,null,null,null]
  ];
  var DAKU = [
    ['が','ぎ','ぐ','げ','ご'],['ざ','じ','ず','ぜ','ぞ'],['だ','ぢ','づ','で','ど'],
    ['ば','び','ぶ','べ','ぼ'],['ぱ','ぴ','ぷ','ぺ','ぽ']
  ];
  var YOUON_BASES = ['き','ぎ','し','じ','ち','に','ひ','び','ぴ','み','り'];
  var YOUON_SUFFIX = ['ゃ','ゅ','ょ'];
  var YOUON = YOUON_BASES.map(function(b){ return YOUON_SUFFIX.map(function(s){ return b+s; }); });

  var ROMAJI_MAP = {
    'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
    'さ':'sa','し':'shi','す':'su','せ':'se','そ':'so','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
    'な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho',
    'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo',
    'ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'wo','ん':'n',
    'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo',
    'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
    'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po'
  };
  YOUON_BASES.forEach(function(b){
    YOUON_SUFFIX.forEach(function(s){
      var combo = b+s;
      var baseR = ROMAJI_MAP[b].replace(/i$/,'');
      var sufR = {'ゃ':'ya','ゅ':'yu','ょ':'yo'}[s];
      ROMAJI_MAP[combo] = baseR + sufR;
    });
  });

  var ROW_LABELS = {
    sei: ['','k','s','t','n','h','m','y','r','w','n'],
    daku: ['g','z','d','b','p'],

  /* ===================== 状态 ===================== */
  var state = {
    page: 'home',
    songs: [],
    currentSongId: null,
    currentTab: 'sei',
    selectedKana: null,
    settings: { provider: 'claude', keys: { openai:'', gemini:'', deepseek:'' } },
    kanaCycle: {},
    kanaWordIndex: {},
    kanaLineIndex: {},
    kanaCount: {}
  };

  /* ===================== storage 封装 ===================== */
  async function storeGet(key){
    try{ var r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }catch(e){ return null; }
  }
  async function storeSet(key, val){
    try{ await window.storage.set(key, JSON.stringify(val), false); }catch(e){ /* best effort */ }
  }

  /* ===================== toast ===================== */
  function toast(msg){
    var wrap = document.getElementById('toast-wrap');
    var el = document.createElement('div'); el.className='toast'; el.textContent=msg;
    wrap.appendChild(el); setTimeout(function(){ el.remove(); }, 3400);
  }
  function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }

  /* ===================== index building ===================== */
  function rebuildIndex(){
    var wordIdx = {}, lineIdx = {}, count = {};
    state.songs.forEach(function(song){
      (song.lines||[]).forEach(function(line, li){
        var jpFull = (line.tokens||[]).map(function(t){return t.text;}).join('');
        var lineKanaSet = {};
        (line.tokens||[]).forEach(function(tok, ti){
          (tok.kanaChars||[]).forEach(function(k){
            if(!ALL_VALID_KANA[k]) return;
            count[k] = (count[k]||0)+1;
            if(!wordIdx[k]) wordIdx[k]=[];
            var exists = wordIdx[k].some(function(w){ return w.text===tok.text && w.reading===tok.reading; });
            if(!exists && tok.text.trim()!=='') wordIdx[k].push({text:tok.text, reading:tok.reading, romaji:tok.romaji, gloss:tok.gloss});
            lineKanaSet[k] = true;
          });
        });
        Object.keys(lineKanaSet).forEach(function(k){
          if(!lineIdx[k]) lineIdx[k]=[];
          lineIdx[k].push({songId:song.id, songTitle:song.title, lineIdx:li, jp:jpFull, zh:line.zh});
        });
      });
    });
    state.kanaWordIndex = wordIdx;
    state.kanaLineIndex = lineIdx;
    state.kanaCount = count;
  }

  /* ===================== 页面切换 ===================== */
  function renderTopTabs(){
    var el = document.getElementById('pageTabs');
    Array.prototype.forEach.call(el.querySelectorAll('.page-tab'), function(b){
      b.classList.toggle('active', b.getAttribute('data-page')===state.page);
      b.onclick = function(){ state.page = b.getAttribute('data-page'); renderTopTabs(); renderPage(); };
    });
  }

  function renderPage(){
    var main = document.getElementById('mainArea');
    if(state.page === 'home'){
      var songCount = state.songs.length;
      var kanaCount = Object.keys(state.kanaCount).length;
      main.innerHTML =
        '<div class="cover-page">'+
          '<div class="cover-title">うたがな</div>'+
          '<div class="cover-sub">五十音 × 你的歌单</div>'+
          '<div class="cover-stats">'+
            '<div><b>'+kanaCount+' / '+TOTAL_KANA_COUNT+'</b>已收录假名</div>'+
            '<div><b>'+songCount+'</b>首歌</div>'+
          '</div>'+
          '<div class="cover-cards">'+
            '<button class="cover-card" data-page="kana"><div class="cc-icon">あ</div><div class="cc-title">假名</div><div class="cc-desc">点一个假名，看单词和歌词</div></button>'+
            '<button class="cover-card" data-page="lyrics"><div class="cc-icon">♪</div><div class="cc-title">歌词</div><div class="cc-desc">带注音、带翻译地读一首歌</div></button>'+
          '</div>'+
        '</div>';
      Array.prototype.forEach.call(main.querySelectorAll('.cover-card'), function(b){
        b.addEventListener('click', function(){ state.page = b.getAttribute('data-page'); renderTopTabs(); renderPage(); });
      });
      return;
    }
    if(state.page === 'kana'){
      main.innerHTML =
        '<div class="kana-page">'+
          '<section class="pane" id="keypadPane">'+
            '<div class="progress-row"><span id="progressLabel"></span><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>'+
            '<div class="tabs" id="tabs"></div>'+
            '<div class="kgrid" id="kgrid"></div>'+
          '</section>'+
          '<section class="pane" id="detailPane"></section>'+
        '</div>';
      renderTabs(); renderKeypad(); renderProgress(); renderDetail();
    } else {
      main.innerHTML =
        '<div class="lyrics-page">'+
          '<div class="toggle-line"><input type="checkbox" id="romajiToggle"/><label for="romajiToggle">显示罗马字</label></div>'+
          '<div class="songlist" id="songlist"></div>'+
          '<div id="lyricsWrap"></div>'+
        '</div>';
      document.getElementById('romajiToggle').addEventListener('change', renderLyrics);
      renderSonglist(); renderLyrics();
    }
  }

  /* ===================== keypad (kana page) ===================== */
  function renderProgress(){
    var total = Object.keys(state.kanaCount).length;
    document.getElementById('progressLabel').textContent = '已收录 '+total+' / '+TOTAL_KANA_COUNT+' 个假名';
    document.getElementById('progressFill').style.width = (100*total/TOTAL_KANA_COUNT)+'%';
  }

  function renderTabs(){
    var tabs = [['sei','清音'],['daku','浊音・半浊音'],['youon','拗音']];
    var el = document.getElementById('tabs');
    el.innerHTML = tabs.map(function(t){
      return '<button class="tab-btn'+(state.currentTab===t[0]?' active':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('.tab-btn'), function(b){
      b.addEventListener('click', function(){ state.currentTab = b.getAttribute('data-tab'); renderTabs(); renderKeypad(); });
    });
  }

  function currentGrid(){
    if(state.currentTab==='sei') return SEION;
    if(state.currentTab==='daku') return DAKU;
    return YOUON;
  }

  function renderKeypad(){
    var grid = currentGrid();
    var rowLabels = ROW_LABELS[state.currentTab];
    var colLabels = COL_LABELS[state.currentTab];
    var numCols = grid[0].length;
    var gEl = document.getElementById('kgrid');
    gEl.className = 'kgrid ' + state.currentTab;
    gEl.style.gridTemplateColumns = '26px repeat('+numCols+', 1fr)';

    var cells = ['<div class="klabel corner"></div>'];
    colLabels.forEach(function(c){ cells.push('<div class="klabel col">'+c+'</div>'); });
    grid.forEach(function(row, ri){
      cells.push('<div class="klabel row">'+(rowLabels[ri]||'')+'</div>');
      row.forEach(function(k){
        if(!k){ cells.push('<div class="kbtn empty"></div>'); return; }
        var n = state.kanaCount[k]||0;
        var cls = 'kbtn' + (n?' has-hits':'') + (state.selectedKana===k?' selected':'');
        cells.push('<button class="'+cls+'" data-kana="'+k+'" title="'+k+(n?(' · '+n+'处'):'')+'">'+k+'</button>');
      });
    });
    gEl.innerHTML = cells.join('');

    Array.prototype.forEach.call(gEl.querySelectorAll('.kbtn[data-kana]'), function(b){
      b.addEventListener('click', function(){
        state.selectedKana = b.getAttribute('data-kana');
        b.classList.add('pulse'); setTimeout(function(){ b.classList.remove('pulse'); }, 500);
        renderKeypad(); renderDetail();
        var detailPane = document.getElementById('detailPane');
        if(detailPane) requestAnimationFrame(function(){ detailPane.scrollIntoView({behavior:'smooth', block:'start'}); });
      });
    });
  }

  function renderDetail(){
    var pane = document.getElementById('detailPane');
    var k = state.selectedKana;
    if(!k){
      pane.innerHTML = '<div class="detail-empty">点一个假名，看看它的读音、相关单词和歌词</div>';
      return;
    }
    var romaji = ROMAJI_MAP[k] || '';
    var words = state.kanaWordIndex[k] || [];
    var lines = state.kanaLineIndex[k] || [];

    var html = '<div class="detail-head"><div class="detail-kana">'+k+'</div><div class="detail-romaji">'+romaji+'</div></div>';

    if(!words.length && !lines.length){
      html += '<div class="detail-empty">这个假名还没在你收录的歌里出现过——加更多歌就会补上</div>';
    } else {
      if(words.length){
        html += '<div class="detail-sec-title">相关单词</div><div>';
        html += words.map(function(w){
          return '<span class="word-chip"><span class="w-text">'+escapeHtml(w.text)+'</span>'+
            '<span class="w-reading">'+escapeHtml(w.reading)+'</span>'+
            '<span class="w-gloss">'+escapeHtml(w.gloss||'')+'</span></span>';
        }).join('');
        html += '</div>';
      }
      if(lines.length){
        html += '<div class="detail-sec-title">相关歌词</div>';
        html += lines.map(function(l, i){
          return '<div class="line-card">'+
            '<div class="lc-jp">'+escapeHtml(l.jp)+'</div>'+
            '<div class="lc-zh">'+escapeHtml(l.zh||'')+'</div>'+
            '<div class="lc-meta"><span>'+escapeHtml(l.songTitle)+'</span>'+
            '<button class="lc-jump" data-idx="'+i+'">在歌词页查看 →</button></div>'+
          '</div>';
        }).join('');
      }
    }
    pane.innerHTML = html;

    Array.prototype.forEach.call(pane.querySelectorAll('.lc-jump'), function(b){
      b.addEventListener('click', function(){
        var l = lines[+b.getAttribute('data-idx')];
        state.page = 'lyrics'; state.currentSongId = l.songId;
        renderTopTabs(); renderPage();
        requestAnimationFrame(function(){
          var el = document.getElementById('line-'+l.songId+'-'+l.lineIdx);
          if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('pulse-line');
            setTimeout(function(){ el.classList.remove('pulse-line'); }, 1600); }
        });
      });
    });
  }

  /* ===================== 歌单 / 歌词 (lyrics page) ===================== */
  function renderSonglist(){
    var el = document.getElementById('songlist');
    var html = state.songs.map(function(s){
      return '<button class="song-chip'+(s.id===state.currentSongId?' active':'')+'" data-id="'+s.id+'">'+escapeHtml(s.title)+'</button>';
    }).join('');
    html += '<button class="add-song-chip" id="addSongChip">＋ 收录新歌</button>';
    el.innerHTML = html;
    Array.prototype.forEach.call(el.querySelectorAll('.song-chip'), function(b){
      b.addEventListener('click', function(){ state.currentSongId = b.getAttribute('data-id'); renderSonglist(); renderLyrics(); });
    });
    document.getElementById('addSongChip').addEventListener('click', openAddSongModal);
  }

  function renderLyrics(){
    var wrap = document.getElementById('lyricsWrap');
    if(!wrap) return;
    var song = state.songs.find(function(s){ return s.id===state.currentSongId; });
    if(!song){
      wrap.innerHTML = '<div class="empty-state">还没有收录任何歌<br/>点上面「＋ 收录新歌」，把第一首歌加进来</div>';
      return;
    }
    var romajiEl = document.getElementById('romajiToggle');
    var romajiOn = romajiEl ? romajiEl.checked : false;
    var html = '<div class="lyrics'+(romajiOn?' show-romaji':'')+'">';
    html += '<div class="song-meta"><h2>'+escapeHtml(song.title)+'</h2>';
    if(song.artist) html += '<div class="artist">'+escapeHtml(song.artist)+'</div>';
    html += '</div>';

    (song.lines||[]).forEach(function(line, li){
      html += '<div class="lyrics-line" id="line-'+song.id+'-'+li+'">';
      html += '<div class="jp-row">';
      (line.tokens||[]).forEach(function(tok, ti){
        var id = 'tok-'+song.id+'-'+li+'-'+ti;
        if(tok.text.trim()===''){ html += escapeHtml(tok.text); return; }
        var needsRuby = tok.reading && tok.reading !== tok.text;
        if(needsRuby){
          html += '<ruby class="tok" id="'+id+'" data-li="'+li+'" data-ti="'+ti+'">'+escapeHtml(tok.text)+'<rt>'+escapeHtml(tok.reading)+'</rt></ruby>';
        } else if(tok.gloss || tok.romaji){
          html += '<span class="tok-plain tok" id="'+id+'" data-li="'+li+'" data-ti="'+ti+'">'+escapeHtml(tok.text)+'</span>';
        } else {
          html += escapeHtml(tok.text);
        }
      });
      html += '</div>';
      html += '<div class="romaji-row">'+ (line.tokens||[]).map(function(t){return t.romaji||'';}).join(' ') +'</div>';
      if(line.zh) html += '<div class="zh-row">'+escapeHtml(line.zh)+'</div>';
      html += '</div>';
    });
    html += '</div>';
    wrap.innerHTML = html;

    Array.prototype.forEach.call(wrap.querySelectorAll('.tok'), function(el){
      el.addEventListener('click', function(){
        var li = +el.getAttribute('data-li'), ti = +el.getAttribute('data-ti');
        var tok = song.lines[li].tokens[ti];
        openTokenPopover(el, tok);
      });
    });
  }

  /* ===================== token popover ===================== */
  function closePopover(){
    var p = document.getElementById('tokPopover');
    if(p) p.remove();
    document.removeEventListener('click', outsidePopoverClick, true);
  }
  function outsidePopoverClick(e){
    var p = document.getElementById('tokPopover');
    if(p && !p.contains(e.target)) closePopover();
  }
  function openTokenPopover(anchorEl, tok){
    closePopover();
    var p = document.createElement('div'); p.className='popover'; p.id='tokPopover';
    var kanas = (tok.kanaChars||[]).filter(function(k){ return ALL_VALID_KANA[k]; });
    p.innerHTML =
      '<div class="pv-reading">'+escapeHtml(tok.reading||tok.text)+'</div>'+
      (tok.gloss ? '<div class="pv-gloss">'+escapeHtml(tok.gloss)+'</div>' : '') +
      (tok.romaji ? '<div class="pv-romaji">'+escapeHtml(tok.romaji)+'</div>' : '') +
      '<div class="pv-kanas">' + kanas.map(function(k){ return '<button class="pv-kana-btn" data-k="'+k+'">'+k+' →</button>'; }).join('') + '</div>';
    document.body.appendChild(p);
    var r = anchorEl.getBoundingClientRect();
    var top = r.bottom + 8, left = r.left;
    if(left + 220 > window.innerWidth) left = window.innerWidth - 230;
    p.style.top = top + 'px'; p.style.left = left + 'px';
    Array.prototype.forEach.call(p.querySelectorAll('.pv-kana-btn'), function(b){
      b.addEventListener('click', function(){ jumpToKeypad(b.getAttribute('data-k')); });
    });
    setTimeout(function(){ document.addEventListener('click', outsidePopoverClick, true); }, 10);
  }

  function jumpToKeypad(kana){
    var t = tabOf(kana);
    if(!t) return;
    closePopover();
    state.page = 'kana'; state.currentTab = t; state.selectedKana = kana;
    renderTopTabs(); renderPage();
  }

  /* ===================== 添加新歌 modal ===================== */
  function openAddSongModal(){
    var root = document.getElementById('modalRoot');
    root.innerHTML =
      '<div class="overlay" id="addOverlay"><div class="modal">'+
        '<h3>收录新歌</h3>'+
        '<div class="field"><label>歌名</label><input type="text" id="asTitle" placeholder="比如：夜に駆ける"/></div>'+
        '<div class="field"><label>歌手（选填）</label><input type="text" id="asArtist" placeholder=""/></div>'+
        '<div class="field"><label>粘贴歌词原文（可以带汉字，逐行粘贴）</label><textarea id="asLyrics" placeholder="沈むように溶けてゆくように&#10;二人だけの空が広がる夜に&#10;……"></textarea></div>'+
        '<div id="asStatus"></div>'+
        '<div class="modal-actions"><button class="btn" id="asCancel">取消</button><button class="btn primary" id="asParse">开始解析</button></div>'+
      '</div></div>';
    document.getElementById('asCancel').addEventListener('click', function(){ root.innerHTML=''; });
    document.getElementById('addOverlay').addEventListener('click', function(e){ if(e.target.id==='addOverlay') root.innerHTML=''; });
    document.getElementById('asParse').addEventListener('click', handleParseSong);
  }

  function buildParsePrompt(rawLyrics){
    return '你是日语教学助手。请把下面的歌词逐行拆成词/字单元，给出每个单元的读音（统一用平假名，即使原文是片假名或汉字）、罗马字、简短的中文释义，以及它包含的"有效假名单元"列表；同时给每一行配一句准确、自然的中文翻译。\n'+
'有效假名单元只能是以下这些（拗音必须整体作为一个单元，比如"きゃ"是一个单元，不要拆成"き"+"ゃ"）：\n'+
'清音: あいうえお かきくけこ さしすせそ たちつてと なにぬねの はひふへほ まみむめも やゆよ らりるれろ わを ん\n'+
'浊音/半浊音: がぎぐげご ざじずぜぞ だぢづでど ばびぶべぼ ぱぴぷぺぽ\n'+
'拗音: きゃきゅきょ ぎゃぎゅぎょ しゃしゅしょ じゃじゅじょ ちゃちゅちょ にゃにゅにょ ひゃひゅひょ びゃびゅびょ ぴゃぴゅぴょ みゃみゅみょ りゃりゅりょ\n'+
'长音符"ー"、促音"っ"、标点符号等不属于上面列表的部分不要放进 kanaChars，但可以正常出现在 reading 字符串里；标点符号单独成一个 token，reading/romaji/gloss 都留空，kanaChars 为空数组。\n'+
'只输出 JSON，不要输出任何其他文字、不要用 markdown 代码块包裹。JSON 结构：\n'+
'{"lines":[{"zh":"这一行的中文翻译","tokens":[{"text":"原文片段","reading":"平假名读音","romaji":"罗马字","gloss":"简短中文释义（若是标点或空格则留空）","kanaChars":["构成它的有效假名单元们"]}]}]}\n\n'+
'歌词原文：\n' + rawLyrics;
  }

  async function callLLM(prompt){
    var s = state.settings;
    if(s.provider === 'claude'){
      var resp = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens: 4000, messages:[{role:'user', content: prompt}] })
      });
      if(!resp.ok) throw new Error('Claude 接口出错 ('+resp.status+')');
      var data = await resp.json();
      var textBlock = (data.content||[]).find(function(b){ return b.type==='text'; });
      if(!textBlock) throw new Error('Claude 没有返回文本内容');
      return textBlock.text;
    }
    if(s.provider === 'openai'){
      if(!s.keys.openai) throw new Error('还没填 OpenAI 的 API Key');
      var resp2 = await fetch('https://api.openai.com/v1/chat/completions', {
        method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.keys.openai},
        body: JSON.stringify({ model:'gpt-4o-mini', messages:[{role:'user', content: prompt}] })
      });
      if(!resp2.ok) throw new Error('OpenAI 接口出错 ('+resp2.status+')');
      var data2 = await resp2.json();
      return data2.choices[0].message.content;
    }
    if(s.provider === 'gemini'){
      if(!s.keys.gemini) throw new Error('还没填 Gemini 的 API Key');
      var resp3 = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+encodeURIComponent(s.keys.gemini), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({contents:[{parts:[{text: prompt}]}]})
      });
      if(!resp3.ok) throw new Error('Gemini 接口出错 ('+resp3.status+')');
      var data3 = await resp3.json();
      return data3.candidates[0].content.parts[0].text;
    }
    if(s.provider === 'deepseek'){
      if(!s.keys.deepseek) throw new Error('还没填 DeepSeek 的 API Key');
      var resp4 = await fetch('https://api.deepseek.com/chat/completions', {
        method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.keys.deepseek},
        body: JSON.stringify({ model:'deepseek-chat', messages:[{role:'user', content: prompt}] })
      });
      if(!resp4.ok) throw new Error('DeepSeek 接口出错 ('+resp4.status+')');
      var data4 = await resp4.json();
      return data4.choices[0].message.content;
    }
    throw new Error('未知的解析引擎');
  }

  function extractJson(text){
    var cleaned = text.replace(/```json/gi,'').replace(/```/g,'').trim();
    var start = cleaned.indexOf('{'); var end = cleaned.lastIndexOf('}');
    if(start===-1 || end===-1) throw new Error('没在返回内容里找到 JSON');
    return JSON.parse(cleaned.slice(start, end+1));
  }

  async function handleParseSong(){
    var title = document.getElementById('asTitle').value.trim();
    var artist = document.getElementById('asArtist').value.trim();
    var raw = document.getElementById('asLyrics').value.trim();
    var statusEl = document.getElementById('asStatus');
    var btn = document.getElementById('asParse');
    if(!title){ toast('先给这首歌起个名字'); return; }
    if(!raw){ toast('还没粘贴歌词'); return; }

    btn.disabled = true;
    statusEl.innerHTML = '<div class="loading-row"><div class="spinner"></div>正在拆解假名与读音…</div>';

    try{
      var text = await callLLM(buildParsePrompt(raw));
      var parsed = extractJson(text);
      if(!parsed.lines || !Array.isArray(parsed.lines)) throw new Error('返回的数据结构不对');

      var song = {
        id: 's_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
        title: title, artist: artist, addedAt: Date.now(),
        lines: parsed.lines.map(function(l){
          return { zh: l.zh || '', tokens: (l.tokens||[]).map(function(t){
            return {
              text: t.text||'', reading: t.reading||t.text||'', romaji: t.romaji||'', gloss: t.gloss||'',
              kanaChars: Array.isArray(t.kanaChars) ? t.kanaChars.filter(function(k){return ALL_VALID_KANA[k];}) : []
            };
          })};
        })
      };

      state.songs.unshift(song);
      await storeSet('songs-library', state.songs);
      rebuildIndex();
      state.currentSongId = song.id;
      document.getElementById('modalRoot').innerHTML = '';
      renderPage();
      toast('「'+title+'」收录好了');
    }catch(err){
      statusEl.innerHTML = '<div style="color:var(--plum);font-size:13px;margin-top:6px;">解析失败：'+escapeHtml(err.message||String(err))+'，可以到设置里换个引擎试试</div>';
      btn.disabled = false;
    }
  }

  /* ===================== 设置 modal ===================== */
  function openSettingsModal(){
    var s = state.settings;
    var root = document.getElementById('modalRoot');
    var providers = [['claude','Claude（默认，无需填 Key）',false],['openai','OpenAI',true],['gemini','Gemini',true],['deepseek','DeepSeek',true]];
    var radioHtml = providers.map(function(p){
      return '<label class="radio-opt'+(s.provider===p[0]?' selected':'')+'">'+
        '<input type="radio" name="provider" value="'+p[0]+'" '+(s.provider===p[0]?'checked':'')+'/>'+
        '<span>'+p[1]+'</span>'+(p[2]?'<span class="tag">需要 Key</span>':'') + '</label>';
    }).join('');

    root.innerHTML =
      '<div class="overlay" id="setOverlay"><div class="modal">'+
        '<h3>设置</h3>'+
        '<div class="field"><label>解析引擎</label><div class="radio-row">'+radioHtml+'</div></div>'+
        '<div class="field"><label>OpenAI API Key</label><input type="password" id="keyOpenai" value="'+escapeHtml(s.keys.openai)+'"/></div>'+
        '<div class="field"><label>Gemini API Key</label><input type="password" id="keyGemini" value="'+escapeHtml(s.keys.gemini)+'"/></div>'+
        '<div class="field"><label>DeepSeek API Key</label><input type="password" id="keyDeepseek" value="'+escapeHtml(s.keys.deepseek)+'"/></div>'+
        '<div id="testStatus"></div>'+
        '<div class="modal-actions"><button class="btn" id="setTest">测试当前引擎</button><button class="btn" id="setCancel">取消</button><button class="btn primary" id="setSave">保存</button></div>'+
      '</div></div>';

    Array.prototype.forEach.call(root.querySelectorAll('input[name=provider]'), function(r){
      r.addEventListener('change', function(){
        Array.prototype.forEach.call(root.querySelectorAll('.radio-opt'), function(el){ el.classList.remove('selected'); });
        r.closest('.radio-opt').classList.add('selected');
      });
    });
    document.getElementById('setCancel').addEventListener('click', function(){ root.innerHTML=''; });
    document.getElementById('setOverlay').addEventListener('click', function(e){ if(e.target.id==='setOverlay') root.innerHTML=''; });

    document.getElementById('setTest').addEventListener('click', async function(){
      var provider = root.querySelector('input[name=provider]:checked').value;
      var tmp = { provider: provider, keys: {
        openai: document.getElementById('keyOpenai').value.trim(),
        gemini: document.getElementById('keyGemini').value.trim(),
        deepseek: document.getElementById('keyDeepseek').value.trim()
      }};
      var old = state.settings; state.settings = tmp;
      var statusEl = document.getElementById('testStatus');
      statusEl.innerHTML = '<div class="loading-row"><div class="spinner"></div>测试中…</div>';
      try{
        var t = await callLLM('只回复两个字：OK');
        statusEl.innerHTML = '<div style="color:#7bc47f;font-size:13px;margin-top:6px;">连通了 → '+escapeHtml(t.trim().slice(0,20))+'</div>';
      }catch(err){
        statusEl.innerHTML = '<div style="color:var(--plum);font-size:13px;margin-top:6px;">没通：'+escapeHtml(err.message||String(err))+'</div>';
      }
      state.settings = old;
    });

    document.getElementById('setSave').addEventListener('click', async function(){
      var provider = root.querySelector('input[name=provider]:checked').value;
      state.settings = { provider: provider, keys: {
        openai: document.getElementById('keyOpenai').value.trim(),
        gemini: document.getElementById('keyGemini').value.trim(),
        deepseek: document.getElementById('keyDeepseek').value.trim()
      }};
      await storeSet('settings', state.settings);
      root.innerHTML = ''; toast('设置保存好了');
    });
  }

  document.getElementById('settingsBtn').addEventListener('click', openSettingsModal);
  function goHome(){ state.page = 'home'; renderTopTabs(); renderPage(); }
  document.getElementById('homeBtn').addEventListener('click', goHome);
  document.getElementById('brandHome').addEventListener('click', goHome);

  /* ===================== 初始化 ===================== */
  async function init(){
    var savedSongs = await storeGet('songs-library');
    var savedSettings = await storeGet('settings');
    if(Array.isArray(savedSongs) && savedSongs.length){
      state.songs = savedSongs;
    } else {
      state.songs = PRELOADED_SONGS;
      await storeSet('songs-library', state.songs);
    }
    if(savedSettings) state.settings = savedSettings;
    if(state.songs.length) state.currentSongId = state.songs[0].id;

    rebuildIndex();
    renderTopTabs();
    renderPage();
  }

  init();
})();
</script>
